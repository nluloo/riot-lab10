apiVersion: apps/v1
kind: Deployment
metadata:
  name: node1
  labels:
    app: node1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node1
  template:
    metadata:
      labels:
        app: node1
    spec:
      containers:
        - name: node
          image: riot-nodes:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6001
          env:
            - name: NODE_ID
              value: "1"
            - name: CLUSTER_MEMBERS
              value: "1=node1:6001,2=node2:6002,3=node3:6003,4=node4:6004,5=node5:6005"
            - name: HEARTBEAT_INTERVAL_MS
              value: "2000"
---
apiVersion: v1
kind: Service
metadata:
  name: node1
spec:
  type: ClusterIP
  selector:
    app: node1
  ports:
    - port: 6001
      targetPort: 6001
---
