name: lab8

services:
  primary:
    container_name: primary
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: carrental
      TZ: Europe/Minsk
    ports:
      - "5433:5432"
    volumes:
      - primary-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carrental"]
      interval: 2s
      timeout: 3s
      retries: 30

  replica:
    container_name: replica
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: carrental
      TZ: Europe/Minsk
    ports:
      - "5434:5432"
    volumes:
      - replica-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carrental"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    container_name: server
    image: riot-lab8/server:1.0
    build:
      context: ./DistributedSystem
      dockerfile: Server/Dockerfile
    environment:
      SERVER_PORT: "5000"
      PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-1500}
      HEARTBEAT_INTERVAL_MS: "2000"
      CARRENTAL_PRIMARY_CONNECTION: "Host=primary;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};Database=carrental;Timeout=5"
      CARRENTAL_REPLICA_CONNECTION: "Host=replica;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres};Database=carrental;Timeout=5"
      PUBLISHER_BROKERS: "broker:5001"
      CLUSTER_MEMBERS: "1=node1:6001,2=node2:6002,3=node3:6003,4=node4:6004,5=node5:6005"
      TZ: Europe/Minsk
    ports:
      - "5000:5000"
    depends_on:
      primary:
        condition: service_healthy
      replica:
        condition: service_healthy
      broker:
        condition: service_started

  broker:
    container_name: broker
    image: riot-lab8/broker:1.0
    build:
      context: ./DistributedSystem
      dockerfile: Broker/Dockerfile
    environment:
      BROKER_ID: Broker-1
      BROKER_PORT: "5001"
      TZ: Europe/Minsk
    ports:
      - "5001:5001"

  node1:
    container_name: node1
    image: riot-lab8/nodes:1.0
    build:
      context: ./DistributedSystem
      dockerfile: Nodes/Dockerfile
    environment:
      NODE_ID: "1"
      CLUSTER_MEMBERS: "1=node1:6001,2=node2:6002,3=node3:6003,4=node4:6004,5=node5:6005"
      HEARTBEAT_INTERVAL_MS: "2000"
      TZ: Europe/Minsk
    ports:
      - "6001:6001"

  node2:
    container_name: node2
    image: riot-lab8/nodes:1.0
    build:
      context: ./DistributedSystem
      dockerfile: Nodes/Dockerfile
    environment:
      NODE_ID: "2"
      CLUSTER_MEMBERS: "1=node1:6001,2=node2:6002,3=node3:6003,4=node4:6004,5=node5:6005"
      HEARTBEAT_INTERVAL_MS: "2000"
      TZ: Europe/Minsk
    ports:
      - "6002:6002"

  node3:
    container_name: node3
    image: riot-lab8/nodes:1.0
    build:
      context: ./DistributedSystem
      dockerfile: Nodes/Dockerfile
    environment:
      NODE_ID: "3"
      CLUSTER_MEMBERS: "1=node1:6001,2=node2:6002,3=node3:6003,4=node4:6004,5=node5:6005"
      HEARTBEAT_INTERVAL_MS: "2000"
      TZ: Europe/Minsk
    ports:
      - "6003:6003"

  node4:
    container_name: node4
    image: riot-lab8/nodes:1.0
    build:
      context: ./DistributedSystem
      dockerfile: Nodes/Dockerfile
    environment:
      NODE_ID: "4"
      CLUSTER_MEMBERS: "1=node1:6001,2=node2:6002,3=node3:6003,4=node4:6004,5=node5:6005"
      HEARTBEAT_INTERVAL_MS: "2000"
      TZ: Europe/Minsk
    ports:
      - "6004:6004"

  node5:
    container_name: node5
    image: riot-lab8/nodes:1.0
    build:
      context: ./DistributedSystem
      dockerfile: Nodes/Dockerfile
    environment:
      NODE_ID: "5"
      CLUSTER_MEMBERS: "1=node1:6001,2=node2:6002,3=node3:6003,4=node4:6004,5=node5:6005"
      HEARTBEAT_INTERVAL_MS: "2000"
      TZ: Europe/Minsk
    ports:
      - "6005:6005"

  # Запуск: docker compose --profile tools run --rm client
  client:
    container_name: client
    profiles: ["tools"]
    image: riot-lab8/client:1.0
    build:
      context: ./DistributedSystem
      dockerfile: Client/Dockerfile
    environment:
      SERVER_HOST: server
      SERVER_PORT: "5000"
      TZ: Europe/Minsk
    stdin_open: true
    tty: true
    depends_on:
      - server

networks:
  default:
    name: riot-lab8

volumes:
  primary-data:
  replica-data:
