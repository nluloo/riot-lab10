apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS locations (
        id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        name TEXT NOT NULL,
        address TEXT NOT NULL
    );
    CREATE TABLE IF NOT EXISTS cars (
        id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        brand TEXT NOT NULL,
        model TEXT NOT NULL,
        registration_number TEXT NOT NULL UNIQUE,
        location_id INTEGER NOT NULL REFERENCES locations (id),
        daily_price NUMERIC(10, 2) NOT NULL CHECK (daily_price > 0),
        is_available BOOLEAN NOT NULL
    );
    CREATE TABLE IF NOT EXISTS customers (
        id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        full_name TEXT NOT NULL,
        phone TEXT NOT NULL UNIQUE
    );
    CREATE TABLE IF NOT EXISTS rentals (
        id INTEGER GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
        customer_id INTEGER NOT NULL REFERENCES customers (id),
        car_id INTEGER NOT NULL REFERENCES cars (id),
        start_date DATE NOT NULL,
        end_date DATE NOT NULL,
        status TEXT NOT NULL CHECK (status IN ('Active', 'Cancelled', 'Returned')),
        amount NUMERIC(10, 2) NOT NULL CHECK (amount > 0),
        CHECK (end_date >= start_date)
    );
    CREATE TABLE IF NOT EXISTS replication_meta (
        id INTEGER PRIMARY KEY,
        lsn BIGINT NOT NULL,
        updated_at TIMESTAMPTZ NOT NULL
    );
    INSERT INTO locations (name, address) VALUES
        ('Минск', 'ул. Ленина, 10'),
        ('Брест', 'ул. Советская, 25')
    ON CONFLICT DO NOTHING;
    INSERT INTO cars (brand, model, registration_number, location_id, daily_price, is_available) VALUES
        ('Toyota', 'Camry', '1234 AB-7', 1, 120, TRUE),
        ('Volkswagen', 'Polo', '2345 BC-7', 1, 80, TRUE),
        ('Kia', 'Rio', '3456 CD-1', 2, 75, TRUE),
        ('Skoda', 'Octavia', '4567 DE-1', 2, 100, FALSE)
    ON CONFLICT DO NOTHING;
    INSERT INTO customers (full_name, phone) VALUES
        ('Иван Иванов', '+375291112233')
    ON CONFLICT DO NOTHING;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: primary-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: primary-db
  template:
    metadata:
      labels:
        app: primary-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: carrental
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: primary
spec:
  type: ClusterIP
  selector:
    app: primary-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: replica
spec:
  type: ClusterIP
  selector:
    app: primary-db
  ports:
    - port: 5432
      targetPort: 5432
